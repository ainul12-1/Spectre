[package]
name = "spectre"
version = "1.0.10"
description = "Spectre - Stealth Anti-Capture Safari Browser"
authors = ["Ainul"]
license = "MIT"
repository = "https://github.com/ainul12-1/Spectre"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["window-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = false
debug = false
