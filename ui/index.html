<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectre</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- Toolbar Safari macOS Header -->
    <header id="toolbar" class="safari-toolbar">
      
      <!-- Kiri: Traffic Lights (Bulat Merah, Kuning, Hijau) + Tombol Navigasi -->
      <div class="toolbar-left">
        <div class="traffic-lights">
          <button id="btn-close" class="traffic-dot close" title="Tutup Window (Close)" aria-label="Close">
            <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
          </button>
          <button id="btn-minimize" class="traffic-dot minimize" title="Kecilkan (Minimize)" aria-label="Minimize">
            <svg viewBox="0 0 12 12"><path d="M2.5 6h7" /></svg>
          </button>
          <button id="btn-maximize" class="traffic-dot maximize" title="Perbesar (Maximize)" aria-label="Maximize">
            <svg viewBox="0 0 12 12"><path d="M3 6h6M6 3v6" /></svg>
          </button>
        </div>

        <div class="nav-actions">
          <button id="btn-back" class="btn-icon" title="Kembali">
            <svg viewBox="0 0 20 20"><path d="M12.5 4.5L7 10l5.5 5.5" /></svg>
          </button>
          <button id="btn-forward" class="btn-icon" title="Maju">
            <svg viewBox="0 0 20 20"><path d="M7.5 4.5L13 10l-5.5 5.5" /></svg>
          </button>
          <button id="btn-home" class="btn-icon" title="Halaman Awal">
            <svg viewBox="0 0 20 20"><path d="M3.5 9.5L10 4l6.5 5.5M5.5 8.5V15.5h9V8.5" /></svg>
          </button>
        </div>
      </div>

      <!-- Tengah: Address Bar Safari -->
      <div class="toolbar-center">
        <form id="address-form" class="safari-address-bar" autocomplete="off">
          <span class="lock-badge">
            <svg viewBox="0 0 16 16">
              <path d="M8 1.5l5 2.2v4.1c0 3.4-2.1 5.9-5 6.7-2.9-.8-5-3.3-5-6.7V3.7l5-2.2z" />
            </svg>
          </span>
          <input
            id="address-input"
            type="text"
            placeholder="Cari atau ketik nama situs web..."
            spellcheck="false"
          />
          <button type="button" id="btn-reload" class="btn-icon" title="Muat Ulang">
            <svg viewBox="0 0 16 16">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.7M13.5 2.5v2.3h-2.3" />
            </svg>
          </button>
        </form>
      </div>

      <!-- Kanan: Tombol Anti-SS -->
      <div class="toolbar-right">
        <button id="btn-stealth" class="stealth-status-badge" title="Klik untuk mengaktifkan/mematikan Anti-Screenshot">
          <span class="dot"></span>
          <span id="stealth-text">Anti-SS: ON</span>
        </button>
      </div>
    </header>

    <!-- Viewport (Start Page) -->
    <main id="viewport" class="viewport-content">
      <div id="start-page" class="start-page">
        <div class="start-card">
          <div class="start-logo">👻</div>
          <h1>Spectre Browser</h1>
          <p>Browser siluman Safari: Tampil normal di layarmu, tembus pandang di hasil Screenshot / Record</p>

          <form id="hero-search-form" class="start-search-box">
            <input id="hero-search-input" type="text" placeholder="Ketik kata kunci pencarian atau URL..." />
            <button type="submit">Buka</button>
          </form>

          <div class="quick-sites">
            <button class="quick-site-btn" data-url="https://www.google.com">
              <span class="icon">🔍</span>
              <span class="label">Google</span>
            </button>
            <button class="quick-site-btn" data-url="https://github.com">
              <span class="icon">🐙</span>
              <span class="label">GitHub</span>
            </button>
            <button class="quick-site-btn" data-url="https://www.youtube.com">
              <span class="icon">▶️</span>
              <span class="label">YouTube</span>
            </button>
            <button class="quick-site-btn" data-url="https://duckduckgo.com">
              <span class="icon">🦆</span>
              <span class="label">DuckDuckGo</span>
            </button>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
