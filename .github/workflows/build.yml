name: Build Spectre Windows (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build Spectre Release via Tauri CLI
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@1.6.3 build --bundles none

      - name: Package with Inno Setup (Single File Installer EXE)
        shell: pwsh
        run: |
          Write-Host "Installing Inno Setup..." -ForegroundColor Yellow
          choco install innosetup --no-progress -y

          Write-Host "Compiling Inno Setup EXE..." -ForegroundColor Yellow
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss

          New-Item -ItemType Directory -Force -Path "./dist-artifacts" | Out-Null
          
          # Inno Setup 1-File EXE
          if (Test-Path "installer\Spectre-Windows-Setup.exe") {
            Copy-Item "installer\Spectre-Windows-Setup.exe" "./dist-artifacts/Spectre-Windows-Setup.exe" -Force
          }

          # Portable single EXE
          if (Test-Path "src-tauri\target\release\spectre.exe") {
            Copy-Item "src-tauri\target\release\spectre.exe" "./dist-artifacts/Spectre-Portable.exe" -Force
          }

          Get-ChildItem "./dist-artifacts"

      - name: Upload Spectre .exe to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spectre-Windows-EXE
          path: ./dist-artifacts/*
          if-no-files-found: error

      - name: Publish Automatic GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Spectre Stealth Browser v1.0.${{ github.run_number }}"
          body: |
            ### 👻 Spectre — Stealth Anti-Capture Safari Browser (Windows)
            - **Spectre-Windows-Setup.exe**: Installer 1-file mandiri dengan Inno Setup (klik langsung pasang & jalan).
            - **Spectre-Portable.exe**: 1 file portable langsung klik 2x.
            - **Fitur**: Anti-Screenshot (`WDA_EXCLUDEFROMCAPTURE`), UI Safari macOS, Animasi Close, & Fisika Kain Lentur.
          files: ./dist-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
