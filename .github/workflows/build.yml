name: Build Spectre Windows (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Detect Project Directory
        id: dir
        shell: pwsh
        run: |
          if (Test-Path "./src-tauri/Cargo.toml") {
            echo "APP_DIR=." >> $env:GITHUB_OUTPUT
            echo "TAURI_DIR=./src-tauri" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "./Spectre/src-tauri/Cargo.toml") {
            echo "APP_DIR=./Spectre" >> $env:GITHUB_OUTPUT
            echo "TAURI_DIR=./Spectre/src-tauri" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not find src-tauri/Cargo.toml"
            exit 1
          }

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ steps.dir.outputs.TAURI_DIR }} -> target"

      - name: Build Spectre (.exe Portable & Installer) via Tauri CLI
        shell: pwsh
        working-directory: ${{ steps.dir.outputs.APP_DIR }}
        run: |
          npx --yes @tauri-apps/cli@1.6.3 build

      - name: Prepare Portable .exe Package
        shell: pwsh
        run: |
          $tauriDir = "${{ steps.dir.outputs.TAURI_DIR }}"
          New-Item -ItemType Directory -Force -Path "./dist-artifacts" | Out-Null
          Copy-Item "$tauriDir/target/release/spectre.exe" "./dist-artifacts/Spectre-Portable.exe" -Force
          if (Test-Path "$tauriDir/target/release/bundle/nsis/*.exe") {
            Copy-Item "$tauriDir/target/release/bundle/nsis/*.exe" "./dist-artifacts/" -Force
          }
          if (Test-Path "$tauriDir/target/release/bundle/msi/*.msi") {
            Copy-Item "$tauriDir/target/release/bundle/msi/*.msi" "./dist-artifacts/" -Force
          }
          Get-ChildItem "./dist-artifacts"

      - name: Upload Spectre .exe to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spectre-Windows-EXE
          path: ./dist-artifacts/*
          if-no-files-found: error

      - name: Publish Automatic GitHub Release (Optional on main/tags)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Spectre Stealth Browser v1.0.${{ github.run_number }}"
          body: |
            ### 👻 Spectre — Stealth Anti-Capture Safari Browser (Windows)
            - **Spectre-Portable.exe**: Langsung klik 2x untuk jalan (tanpa perlu install).
            - **Installer (.exe / .msi)**: Installer resmi jika ingin dipasang di Start Menu.
            - **Fitur**: Anti-Screenshot & Anti-Record (`WDA_EXCLUDEFROMCAPTURE`), UI Safari macOS (Traffic Lights + Animasi Close), & Efek Kain Lentur (Cloth Physics).
          files: ./dist-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
